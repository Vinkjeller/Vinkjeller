<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vinkjelleren</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8a1c3b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238a1c3b'/%3E%3Cpath d='M11 5h10v6c0 4-2 6-5 6s-5-2-5-6zM16 17v8M11 27h10' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: smal enkeltkolonne (mobil først), faner øverst, liste med flasketall til venstre, detaljer i et sheet. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --fg:#1a1e24; --muted:#59636e; --line:#dadee3;
  --accent:#8a1c3b; --accent-fg:#ffffff; --ok:#2c7a4b; --warn:#9a6200; --bad:#b3261e;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
.wbar{position:relative;height:6px;border-radius:3px;background:var(--line);margin:7px 0 3px;overflow:hidden}
.wbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.wbar.end i{background:var(--warn)}.wbar.over i{background:var(--bad)}.wbar.wait i{display:none}
.wbar b{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);transform:translateX(-1px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13161a; --surface:#1b1f25; --fg:#e8ebee; --muted:#97a1ab; --line:#2b313a;
  --accent:#e0708f; --accent-fg:#1a0a10; --ok:#5fbf86; --warn:#e0a33c; --bad:#f0786f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161a; --surface:#1b1f25; --fg:#e8ebee; --muted:#97a1ab; --line:#2b313a;
  --accent:#e0708f; --accent-fg:#1a0a10; --ok:#5fbf86; --warn:#e0a33c; --bad:#f0786f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);
  padding-block:16px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto}
h1{font:700 26px/1.1 var(--display);margin:0;letter-spacing:-.01em}
h2{font:700 17px/1.2 var(--display);margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sub{color:var(--muted);font:400 13px var(--mono)}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:500 14px var(--body);padding:10px 12px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:9px 14px;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tools .full{grid-column:1/-1}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;letter-spacing:.02em}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg);margin:0}
.chk input{width:auto}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;cursor:pointer}
.row:hover{background:var(--surface)}
.qty{font:500 18px var(--mono);text-align:center;border:1px solid var(--line);border-radius:6px;padding:6px 0;background:var(--surface)}
.qty.zero{color:var(--muted);border-style:dashed}
.name{font-weight:500;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.right{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.price{font:400 13px var(--mono);color:var(--muted)}
.chip{font:500 11px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}.chip.mute{color:var(--muted)}
.ex{font:400 11px var(--mono);color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.banner{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--muted);display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.empty{padding:28px 4px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.stat b{display:block;font:700 24px var(--display)}
.stat span{font-size:12px;color:var(--muted)}
.bar{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar i{display:block;height:10px;background:var(--accent);border-radius:2px}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .n{font-family:var(--mono);text-align:right;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;justify-content:center;align-items:flex-end;overflow:auto}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px max(20px,env(safe-area-inset-bottom,0px))}
.sheetbg{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .full{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.photo{max-width:100%;max-height:260px;border-radius:8px;display:block;margin-bottom:10px}
.logrow{border-bottom:1px solid var(--line);padding:10px 2px}
.score{font:500 15px var(--mono)}
.panel{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:14px;background:var(--bg)}
.mono{font-family:var(--mono)}
.note{white-space:pre-wrap;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:40;font-size:14px}
  .picked{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.selbar{position:sticky;bottom:max(8px,env(safe-area-inset-bottom,0px));margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 4px 18px rgba(0,0,0,.18)}
@media(max-width:420px){.bar{grid-template-columns:84px 1fr 38px}}
</style>

</head>
<body>
<div class="wrap">
  <div class="top"><h1>Vinkjelleren</h1><div class="sub" id="summary"></div><div class="sub" id="syncst" style="flex-basis:100%" role="status"></div></div>
  <nav role="tablist" id="tabs"></nav>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
(function(){
'use strict';
var KEY='vinkjeller.v1', YEAR=new Date().getFullYear();
var db={wines:[],log:[]}, ui={tab:'kjeller',q:'',country:'',status:'',sort:'navn',empty:false,sheet:null,storageOk:true,exportText:'',importMsg:'',imp:[],impBusy:'',pr:{src:'DN',max:100,text:'',props:[],done:false,details:true,ean:'',qty:1},lg:{q:'',y:''},rk:{type:'',region:'',food:'',text:'',sort:'samlet',stock:true,wait:false,only:false,wp:3,ww:3,wf:3,locs:{},group:true}};

/* ---------- lagring ---------- */
function load(){
  try{var s=localStorage.getItem(KEY); if(s){var d=JSON.parse(s); if(d&&d.wines){db=d; if(!db.log)db.log=[]; db.wines.forEach(fixVmp); return;}}}catch(e){ui.storageOk=false}
  seed();
}
function save(){ persistLocal(); syncDiff(); }
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function seed(){
  var ex=[
   ['Barolo Cannubi','Marchesi di Barolo',2016,'Italia','Piemonte','Nebbiolo',6,489,'Kjeller, reol A hylle 2',2024,2038,'',1],
   ['Chablis Premier Cru Montée de Tonnerre','Domaine Billaud-Simon',2020,'Frankrike','Burgund','Chardonnay',4,359,'Kjeller, reol B hylle 1',2023,2030,'',1],
   ['Rioja Reserva','La Rioja Alta Viña Ardanza',2015,'Spania','Rioja','Tempranillo',12,249,'Bod, kasse 3',2020,2026,'',1],
   ['Riesling Kabinett Graacher Himmelreich','J.J. Prüm',2019,'Tyskland','Mosel','Riesling',3,279,'Kjeller, reol B hylle 3',2022,2040,'',1]
  ];
  db={wines:ex.map(function(a){return {id:uid(),name:a[0],producer:a[1],vintage:a[2],country:a[3],region:a[4],grape:a[5],qty:a[6],price:a[7],nowPrice:'',location:a[8],from:a[9],to:a[10],score:'',notes:'',vmp:a[11],example:true,added:Date.now()}}),log:[]};
}

/* ---------- bilder i IndexedDB ---------- */
var idb=null;
function openDB(){return new Promise(function(res){ try{var r=indexedDB.open('vinkjeller-bilder',1); r.onupgradeneeded=function(){r.result.createObjectStore('p')}; r.onsuccess=function(){idb=r.result;res(idb)}; r.onerror=function(){res(null)}}catch(e){res(null)} })}
function tx(mode,fn){return openDB().then(function(d){ if(!d)return null; return new Promise(function(res){ try{var t=d.transaction('p',mode),s=t.objectStore('p'),r=fn(s); t.oncomplete=function(){res(r&&r.result!==undefined?r.result:true)}; t.onerror=function(){res(null)}}catch(e){res(null)} })})}
function putPhoto(id,u){return tx('readwrite',function(s){return s.put(u,id)})}
function getPhoto(id){return tx('readonly',function(s){return s.get(id)}).then(function(v){return typeof v==='string'&&v.length>20?v:null})}
function delPhoto(id){return tx('readwrite',function(s){return s.delete(id)})}
function allPhotos(){return openDB().then(function(d){ if(!d)return {}; return new Promise(function(res){ var out={}; try{var c=d.transaction('p').objectStore('p').openCursor(); c.onsuccess=function(){var k=c.result; if(k){out[k.key]=k.value;k.continue()}else res(out)}; c.onerror=function(){res(out)}}catch(e){res(out)} })})}
function resize(file){return new Promise(function(res,rej){ var img=new Image(),u=URL.createObjectURL(file); img.onload=function(){var m=640,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas'); c.width=Math.round(img.width*s);c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',.65))}; img.onerror=function(){rej()}; img.src=u })}

/* ---------- hjelpere ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nok(n){return (n===''||n==null||isNaN(n))?'–':n.toLocaleString('nb-NO',{minimumFractionDigits:(n%1?2:0),maximumFractionDigits:2})+' kr'}
function num(v){var n=parseFloat(String(v).replace(',','.')); return isNaN(n)?'':n}
function status(w){
  var f=num(w.from),t=num(w.to);
  if(f===''&&t==='')return {k:'none',t:'Uten vindu',c:'mute'};
  if(t!==''&&YEAR>t)return {k:'over',t:'Over toppen',c:'bad'};
  if(f!==''&&YEAR<f)return {k:'wait',t:'Lagres til '+f,c:'mute'};
  if(t!==''&&t-YEAR<=2)return {k:'now',t:'Drikk snart',c:'warn'};
  return {k:'now',t:'Drikk nå',c:'ok'};
}
function winInfo(w){
  var f=num(w.from),t=num(w.to);if(f===''||t==='')return null;
  var span=Math.max(1,t-f),pos=Math.max(0,Math.min(1,(YEAR-f)/span)),left=t-YEAR,ph;
  if(left<0)ph='over';else if(YEAR<f)ph='wait';else if(left<=2)ph='end';else if(pos<1/3)ph='early';else ph='mid';
  return {f:f,t:t,pos:pos,left:left,ph:ph};
}
function leftTxt(w){
  var f=num(w.from),t=num(w.to);
  if(t!==''&&YEAR>t)return 'over toppen siden '+t;
  if(f!==''&&YEAR<f)return f-YEAR===1?'klar neste år':'klar om '+(f-YEAR)+' år';
  if(t==='')return '';
  var l=t-YEAR;return l===0?'siste år':(l===1?'1 år igjen':l+' år igjen');
}
function winBar(w){
  var i=winInfo(w),lt=leftTxt(w),f=num(w.from),t=num(w.to);
  if(i)return '<div class="wbar '+i.ph+'" role="img" aria-label="Drikkevindu '+i.f+' til '+i.t+(lt?', '+lt:'')+'"><i style="width:'+Math.round(i.pos*100)+'%"></i><b style="left:'+Math.round(i.pos*100)+'%"></b></div><div class="meta mono">'+i.f+'\u2013'+i.t+(lt?' \u00b7 '+lt:'')+'</div>';
  if(t!==''||f!=='')return '<div class="meta mono">'+(t!==''?'til '+t:'fra '+f)+(lt?' \u00b7 '+lt:'')+'</div>';
  return '';
}
function phaseOf(w){var i=winInfo(w);if(i)return i.ph;var t=num(w.to);if(t==='')return 'open';return t-YEAR<=2?'end':'mid'}
function toast(m){var h=document.getElementById('toastHost');h.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';setTimeout(function(){h.innerHTML=''},2200)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fdate(s){if(!s)return 'ukjent dato';try{return new Date(s+'T12:00').toLocaleDateString('nb-NO',{day:'numeric',month:'short',year:'numeric'})}catch(e){return s}}
function byId(id){return db.wines.filter(function(w){return w.id===id})[0]}
function copy(text,btn){
  function fallback(){var ta=document.getElementById('exportBox'); if(ta){ta.focus();ta.select();} toast('Marker teksten og kopier manuelt')}
  try{navigator.clipboard.writeText(text).then(function(){toast('Kopiert')},fallback)}catch(e){fallback()}
}

/* ---------- visninger ---------- */
var TABS=[['kjeller','Kjeller'],['drikk','Drikk nå'],['rang','Rangering'],['stat','Statistikk'],['logg','Drukket'],['poeng','Lim inn'],['import','Importer'],['backup','Sikkerhetskopi']];
function render(skipSheet){
  var bottles=db.wines.reduce(function(a,w){return a+(+w.qty||0)},0);
  document.getElementById('summary').textContent=bottles+' flasker · '+db.wines.length+' viner';
  document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(ui.tab===t[0])+'">'+t[1]+'</button>'}).join('');
  var b='';
  if(!ui.storageOk) b+='<div class="banner">Nettleseren lar ikke appen lagre data her. Det du legger inn forsvinner når siden lukkes. Ta sikkerhetskopi under «Sikkerhetskopi».</div>';
  if(db.wines.some(function(w){return w.example})) b+='<div class="banner"><span>Eksempelviner (merket «eksempel»). De er ikke dine.</span><button class="btn ghost small" data-act="rmEx">Fjern eksempler</button></div>';
  document.getElementById('banner').innerHTML=b;
  var v=document.getElementById('view');
  v.innerHTML=({kjeller:vKjeller,drikk:vDrikk,rang:vRang,stat:vStat,logg:vLogg,import:vImport,poeng:vPoeng,backup:vBackup})[ui.tab]();
  if(!skipSheet)renderSheet();
  showSync();
}
function wineRow(w,extra){
  var s=status(w);
  var sel=ui.sel&&ui.tab==='kjeller',pk=sel&&ui.sel[w.id];
  return '<button class="row'+(pk?' picked':'')+'" '+(sel?'data-sel="':'data-open="')+w.id+'"><div class="qty'+(w.qty>0?'':' zero')+'">'+esc(w.qty)+'</div>'+
   '<div><div class="name">'+(pk?'\u2713 ':'')+esc(w.name)+' '+(w.vintage?esc(w.vintage):'NV')+(w.example?'<span class="ex">eksempel</span>':'')+'</div>'+
   '<div class="meta">'+esc([w.type,w.producer,w.region,w.country].filter(Boolean).join(' · '))+'</div>'+
   ((w.site||w.location)?'<div class="meta">Lagring: '+esc([w.site,w.location].filter(Boolean).join(' · '))+'</div>':'')+winBar(w)+(extra||'')+'</div>'+
   '<div class="right"><span class="price">'+nok(num(w.price))+'</span><span class="chip '+s.c+'">'+esc(s.t)+'</span>'+(w.score!==''?'<span class="score">'+esc(w.score)+' p</span>':'')+(bestRating(w)?'<span class="score" style="color:var(--muted)">'+esc(rlabel(bestRating(w)))+'</span>':'')+'</div></button>';
}
function filtered(){
  var q=ui.q.trim().toLowerCase();
  var r=db.wines.filter(function(w){
    if(!ui.empty&&!(w.qty>0))return false;
    if(ui.country&&w.country!==ui.country)return false;
    if(ui.site&&wineLoc(w)!==ui.site)return false;
    if(ui.status&&status(w).k!==ui.status)return false;
    if(q){var h=[w.name,w.producer,w.region,w.country,w.grape,w.site,w.location,w.vintage,w.vmp,w.ean,w.type,(w.food||[]).join(' '),w.notes].join(' ').toLowerCase(); if(h.indexOf(q)<0)return false}
    return true});
  var cmp={
    navn:function(a,b){return a.name.localeCompare(b.name,'nb')},
    aargang:function(a,b){return (num(b.vintage)||0)-(num(a.vintage)||0)},
    vindu:function(a,b){return (num(a.to)||9999)-(num(b.to)||9999)},
    pris:function(a,b){return (num(b.price)||0)-(num(a.price)||0)},
    ext:function(a,b){var x=bestRating(a),y=bestRating(b);return n100(y)-n100(x)},
    sted:function(a,b){return locCmp(wineLoc(a),wineLoc(b))||locCmp(plassering(a),plassering(b))||String(a.name).localeCompare(String(b.name),'nb')},
    nyest:function(a,b){return (b.added||0)-(a.added||0)}}[ui.sort];
  return r.sort(cmp);
}
function siteFilterOpts(){var m={};db.wines.forEach(function(w){m[wineLoc(w)]=1});return Object.keys(m).sort(locCmp).map(function(k){return '<option'+(ui.site===k?' selected':'')+'>'+esc(k)+'</option>'}).join('')}
function vKjeller(){
  var countries=Array.from(new Set(db.wines.map(function(w){return w.country}).filter(Boolean))).sort();
  var list=filtered();
  var h='<div class="tools"><div class="full" style="display:flex;gap:8px"><input id="q" type="search" placeholder="Søk i navn, produsent, druer, sted, varenummer" value="'+esc(ui.q)+'" aria-label="Søk"><label class="btn ghost" style="margin:0;display:inline-flex;align-items:center;cursor:pointer;font-size:15px;color:var(--fg)">Skann<input id="g_scan" type="file" accept="image/*" capture="environment" hidden></label></div>'+
   '<div><label for="fl">Lagringssted</label><select id="fl"><option value="">Alle</option>'+siteFilterOpts()+'</select></div>'+
   '<div><label for="fc">Land</label><select id="fc"><option value="">Alle</option>'+countries.map(function(c){return '<option'+(ui.country===c?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></div>'+
   '<div><label for="fs">Drikkevindu</label><select id="fs">'+[['','Alle'],['now','Drikk nå'],['over','Over toppen'],['wait','Lagres'],['none','Uten vindu']].map(function(o){return '<option value="'+o[0]+'"'+(ui.status===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div>'+
   '<div><label for="fo">Sorter</label><select id="fo">'+[['navn','Navn'],['aargang','Årgang (nyest)'],['vindu','Drikkevindu (slutter først)'],['pris','Pris (høyest)'],['ext','Poeng (høyest)'],['sted','Lagringssted'],['nyest','Sist lagt til']].map(function(o){return '<option value="'+o[0]+'"'+(ui.sort===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div>'+

function vDrikk(){

  var over=db.wines.filter(function(w){return w.qty>0&&status(w).k==='over'}).sort(function(a,b){return (num(a.to)||0)-(num(b.to)||0)});
  var now=db.wines.filter(function(w){return w.qty>0&&status(w).k==='now'}).sort(byTo);
  var G=[['end','Slutten av vinduet','2 år eller mindre igjen. Drikk disse først.'],['mid','Midt i vinduet','På vei mot toppen, ingen hast.'],['early','Tidlig i vinduet','Klare, men kan gjerne ligge lenger.'],['open','Uten sluttår','Drikkevinduet har ingen slutt oppgitt.']];
  var h='<h2>Bør drikkes straks</h2>'+(over.length?'<div class="list">'+over.map(function(w){return wineRow(w)}).join('')+'</div>':'<div class="empty">Ingen flasker er over toppen.</div>');
  if(!now.length)return h+'<h2 style="margin-top:22px">Klare nå</h2><div class="empty">Ingen viner har et drikkevindu som omfatter '+YEAR+'. Fyll inn «Drikk fra» og «Drikk til» på vinene.</div>';

  });

function group(key){var m={}; db.wines.forEach(function(w){var k=key(w)||'Ukjent'; m[k]=(m[k]||0)+(+w.qty||0)}); return Object.keys(m).map(function(k){return [k,m[k]]}).filter(function(x){return x[1]>0}).sort(function(a,b){return b[1]-a[1]}).slice(0,8)}

function pnum(s){return parseFloat(String(s).replace(/[.\s]/g,'').replace(',','.'))}
function parseReceiptLines(lines){
  var o={order:'',date:'',lines:[],sum:null};
  var item=/^\s*(\d{1,3})\s+(\d{5,8})\s+(\d+)\s*STK\s+([\d.\s]*\d,\d{2})\s+([\d.\s]*\d,\d{2})\s*NOK/;
  for(var i=0;i<lines.length;i++){
    var l=lines[i], m;
    if((m=l.match(/Ordrenr\.?\s*\/\s*Dato\s*:?\s*(\d+)\s*\/\s*(\d{2})\.(\d{2})\.(\d{4})/))){o.order=m[1];o.date=m[4]+'-'+m[3]+'-'+m[2];continue}
    if((m=l.match(/Sum posisjoner\s+([\d.\s]*\d,\d{2})\s*NOK/))){o.sum=pnum(m[1]);continue}
    if((m=l.match(item))){
      var desc='';
      for(var j=i+1;j<lines.length;j++){
        var n=lines[j].trim(); if(!n)continue;
        if(item.test(lines[j])||/^_+$/.test(n)||/^(Sum posisjoner|Frakt|Total|Linje)\b/.test(n))break;
        desc=n;break;
      }
      var art=m[2];
      o.lines.push({art:art,vmp:art,name:desc,qty:parseInt(m[3],10),unit:pnum(m[4]),total:pnum(m[5])});
    }
  }
  return o;
}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function pdfLines(file){
  return (window.pdfjsLib?Promise.resolve():loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js')).then(function(){
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    return file.arrayBuffer();
  }).then(function(buf){return window.pdfjsLib.getDocument({data:buf}).promise}).then(function(pdf){
    var all=[],p=Promise.resolve();
    for(var n=1;n<=pdf.numPages;n++){(function(n){p=p.then(function(){return pdf.getPage(n)}).then(function(pg){return pg.getTextContent()}).then(function(tc){
      var rows={};
      tc.items.forEach(function(it){if(!it.str||!it.str.trim())return;var y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push({x:it.transform[4],s:it.str})});
      Object.keys(rows).map(Number).sort(function(a,b){return b-a}).forEach(function(y){all.push(rows[y].sort(function(a,b){return a.x-b.x}).map(function(r){return r.s}).join('  '))});
    })})(n)}
    return p.then(function(){return all});
  });
}

var sync={state:'connecting',ready:false,base:null,pushed:{},queued:{},pending:0,q:Promise.resolve(),metaSent:'',metaQueued:false,winesReady:false,metaReady:false};
function wsig(w){var c={};Object.keys(w).forEach(function(k){if(k!=='updated')c[k]=w[k]});return JSON.stringify(c)}
function msig(){return JSON.stringify([db.log,db.imports||[],db.logDel||[]])}
function normMeta(){
  db.log.sort(function(a,b){return (String(a.date)+a.id).localeCompare(String(b.date)+b.id)});

  sync.q=sync.q.then(fn).then(function(){},function(){if(onFail)onFail();sync.state='error';showSync()}).then(function(){sync.pending--;if(!sync.pending&&sync.state==='busy'&&!DBX.dirty&&!DBX.busy){sync.state='ok';showSync()}});

function syncDiff(){
  if(!sync.ready)return;
  var wc=sync.base.collection('wines');
  db.wines.forEach(function(w){
    if(w.example)return;

    if(sync.pushed[w.id]===sg||sync.queued[w.id])return;
    sync.queued[w.id]=1;w.updated=Date.now();
    qpush(function(){var s=wsig(w),body=JSON.parse(JSON.stringify(w));return wc.doc(w.id).set(body).then(function(){sync.pushed[w.id]=s;delete sync.queued[w.id]})},function(){delete sync.queued[w.id]});
  });
  Object.keys(sync.pushed).forEach(function(id){
    if(byId(id)||sync.queued['d'+id])return;
    sync.queued['d'+id]=1;
    qpush(function(){return wc.doc(id).set({id:id,deleted:true,updated:Date.now()}).then(function(){return sync.base.collection('photos').doc(id).delete()}).then(function(){delete sync.pushed[id];delete sync.queued['d'+id]})},function(){delete sync.queued['d'+id]});
  });
  normMeta();
  var ms=msig();
  if(ms!==sync.metaSent&&!sync.metaQueued){
    sync.metaQueued=true;
    qpush(function(){var s=msig(),body={log:JSON.parse(JSON.stringify(db.log)),imports:JSON.parse(JSON.stringify(db.imports||[])),logDel:(db.logDel||[]).slice(),updated:Date.now()};return sync.base.collection('meta').doc('state').set(body).then(function(){sync.metaSent=s;sync.metaQueued=false})},function(){sync.metaQueued=false});

function applyWines(snap){

      if(l){db.wines=db.wines.filter(function(x){return x.id!==d.id});changed=true}
      delete sync.pushed[d.id];return;
    }
    realRemote=true;
    if(!l&&sync.pushed.hasOwnProperty(d.id)&&sync.pushed[d.id]!==undefined&&!byId(d.id))return; /* sletting venter på å bli sendt */
    if(!l||(d.updated||0)>(l.updated||0)){

      sync.pushed[d.id]=sg0;changed=true;

  });

function applyMeta(snap){

  var n0=db.log.length;db.log=db.log.filter(function(e){return !del[e.id]});if(db.log.length!==n0)changed=true;
  var byid={};db.log.forEach(function(e){byid[e.id]=e});

  });
  var hi={};(db.imports||[]).forEach(function(e){hi[e.order]=1});
  ri.forEach(function(e){if(!hi[e.order]){(db.imports=db.imports||[]).push(e);changed=true}});

function vkParse(text){
  var L=String(text).split('\n').map(function(l){return l.trim()}),out=[],seen={};
  for(var i=0;i<L.length;i++){
    if(!/^Pris per enhet/i.test(L[i]))continue;
    var j=i-1;while(j>=0&&!L[j])j--;
    if(j<0)continue;
    var name=L[j].replace(/^Bilde av\s+/i,'').trim();
    if(!name||/^(Utlevert|Totalpris|Totalsum)/i.test(name))continue;
    var vm=name.match(/\s((?:19|20)\d{2}|NV)$/i),vint=vm?(/nv/i.test(vm[1])?'NV':vm[1]):'',base=vm?name.slice(0,vm.index).trim():name;
    var pm=L[i].match(/Kr\s*([\d\s.]*\d,\d{2})/),unit=pm?pnum(pm[1]):'',qty=1,volume='';
    for(var k=i+1;k<Math.min(L.length,i+7);k++){var q=L[k].match(/(\d+)\s*stykk/i);if(q){qty=parseInt(q[1],10);break}}
    for(var k2=i+1;k2<Math.min(L.length,i+7);k2++){var c=L[k2].match(/(\d+(?:,\d+)?)\s*cl\b/i);if(c){volume=c[1]+' cl';break}}
    var key=normS(base)+'|'+vint;
    if(seen[key]){seen[key].qty+=qty;continue}
    var it={name:base,vintage:vint,unit:unit,qty:qty,volume:volume};seen[key]=it;out.push(it);
  }
  return out;
}
function vkLoad(text){
  var items=vkParse(text);

  items.forEach(function(it){
    var c=matchWines(it.name+' '+(it.vintage&&it.vintage!=='NV'?it.vintage:''));
    c.sort(function(a,b){var wa=byId(a.id),wb=byId(b.id);var d=b.ratio-a.ratio;if(Math.abs(d)>0.001)return d;var pa=Math.abs((+wa.price||0)-(+it.unit||0)),pb=Math.abs((+wb.price||0)-(+it.unit||0));return pa-pb});
    it.cands=c;it.pick=c.length?c[0].id:'';

}
function vkResolve(items){

var TYPES=['Rød','Hvit','Rosé','Musserende','Dessert','Sterkvin'];

var REDW=['cabernet','merlot','syrah','shiraz','nebbiolo','sangiovese','tempranillo','pinot noir','grenache','garnacha','malbec','zinfandel','primitivo','nero d avola','barbera','dolcetto','mourvedre','carmenere','pinotage','barolo','barbaresco','chianti','brunello','amarone','rioja','ribera','chateauneuf','valpolicella','montepulciano'];

function inferType(w){
  var t=' '+normS([w.name,w.producer,w.grape].join(' '))+' ',has=function(a){return a.some(function(x){return t.indexOf(' '+x+' ')>=0})};
  if(has(SPARK))return 'Musserende';
  if(has(['rose']))return 'Rosé';
  var r=has(REDW),h=has(WHITEW);
  if(r&&!h)return 'Rød';
  if(h&&!r)return 'Hvit';

function ptsVal(w){var v=[];if(w.score!==''&&w.score!=null&&!isNaN(+w.score))v.push(+w.score);(w.ratings||[]).forEach(function(x){v.push(n100(x))});return v.length?Math.max.apply(null,v):null}
var NOSITE='(uten lagringssted)';
function wineLoc(w){return String(w.site||'').trim()||NOSITE}
function plassering(w){return String(w.location||'').trim()||NOSITE}
function defSite(){try{return localStorage.getItem('vinkjeller.site')||''}catch(e){return ''}}
function siteList(){var m={Hjemme:1,Hytte:1};db.wines.forEach(function(w){if(w.site)m[String(w.site).trim()]=1});return Object.keys(m).sort(function(a,b){return a.localeCompare(b,'nb')})}
function siteDl(){return '<datalist id="sitelist">'+siteList().map(function(x){return '<option value="'+esc(x)+'">'}).join('')+'</datalist>'}
function locCmp(a,b){if(a===b)return 0;if(a===NOSITE)return 1;if(b===NOSITE)return -1;return a.localeCompare(b,'nb',{numeric:true,sensitivity:'base'})}
function selLocs(){var r=ui.rk;return Object.keys(r.locs||{}).filter(function(k){return r.locs[k]})}
function regionKey(w){return String(w.region||'').split(',')[0].trim()}
function foodMatch(w,q){var nq=normS(q);if(!nq)return false;return (w.food||[]).some(function(t){var n=normS(t);return n&&(n.indexOf(nq)>=0||nq.indexOf(n)>=0)})}
function rankInfo(w,q){
  var pv=ptsVal(w),P=pv==null?0.4:Math.max(0,Math.min(1,(pv-80)/20)),st=status(w),to=num(w.to),W;
  if(st.k==='now'){var wi=winInfo(w);W=to===''?0.6:(to-YEAR<=2?1:(wi?0.55+0.4*wi.pos:0.7))}
  else if(st.k==='over')W=0.5;else if(st.k==='none')W=0.3;else W=0;
  var F=q?(foodMatch(w,q)?1:0):null,wp=ui.rk.wp,ww=ui.rk.ww,wf=F===null?0:ui.rk.wf,den=wp+ww+wf;
  return {pv:pv,P:P,W:W,F:F,st:st,comp:den?Math.round((wp*P+ww*W+wf*(F||0))/den*100):0};
}
function winKey(w,i){
  if(i.st.k==='over')return -1;
  if(i.st.k==='now')return num(w.to)===''?9990:num(w.to);
  if(i.st.k==='none')return 9998;
  return 10000+(num(w.from)||0);
}
function rankList(){
  var r=ui.rk,q=(r.text||'').trim()||r.food,out=[];
  db.wines.forEach(function(w){
    if(r.stock&&!(w.qty>0))return;
    if(r.type&&w.type!==r.type)return;
    if(r.region&&regionKey(w)!==r.region)return;
    var sl=selLocs();if(sl.length&&sl.indexOf(wineLoc(w))<0)return;
    var i=rankInfo(w,q);
    if(!r.wait&&i.st.k==='wait')return;
    if(q&&r.only&&!i.F)return;
    out.push({w:w,i:i});
  });
  var pc=function(a,b){return (b.i.pv==null?-1:b.i.pv)-(a.i.pv==null?-1:a.i.pv)};
  var cmp={
    samlet:function(a,b){return (b.i.comp-a.i.comp)||pc(a,b)},
    poeng:pc,
    vindu:function(a,b){return (winKey(a.w,a.i)-winKey(b.w,b.i))||pc(a,b)},
    region:function(a,b){return regionKey(a.w).localeCompare(regionKey(b.w),'nb')||pc(a,b)},
    type:function(a,b){return String(a.w.type||'').localeCompare(String(b.w.type||''),'nb')||pc(a,b)},
    mat:function(a,b){return ((b.i.F||0)-(a.i.F||0))||pc(a,b)},
    sted:function(a,b){return locCmp(wineLoc(a.w),wineLoc(b.w))||locCmp(plassering(a.w),plassering(b.w))||pc(a,b)}
  }[r.sort];
  return {rows:out.sort(cmp),q:q};
}
function uniq(a){var s={};a.forEach(function(x){if(x)s[x]=1});return Object.keys(s).sort(function(x,y){return x.localeCompare(y,'nb')})}
function opts(list,cur,all){return '<option value="">'+all+'</option>'+list.map(function(x){return '<option'+(cur===x?' selected':'')+'>'+esc(x)+'</option>'}).join('')}
function vRang(){
  var r=ui.rk,types=uniq(db.wines.map(function(w){return w.type})),regions=uniq(db.wines.map(regionKey)),foods=uniq([].concat.apply([],db.wines.map(function(w){return w.food||[]})));
  var res=rankList(),untyped=db.wines.filter(function(w){return !w.type&&!w.example}).length;
  var SORTS=[['samlet','Samlet (poeng, drikkevindu og mat)'],['poeng','Poeng (høyest først)'],['vindu','Drikkevindu (haster mest først)'],['region','Region'],['type','Type'],['mat','Matpassing'],['sted','Lagringssted']];
  var locMap={};db.wines.forEach(function(w){if(w.example||(r.stock&&!(w.qty>0)))return;var k=wineLoc(w);locMap[k]=(locMap[k]||0)+(+w.qty||0)});
  var locKeys=Object.keys(locMap).sort(locCmp),sl=selLocs();
  var locHtml='<details class="panel" style="margin:0 0 10px"'+(sl.length?' open':'')+'><summary style="cursor:pointer;font-weight:600">Lagringssted: '+(sl.length?esc(sl.length===1?sl[0]:sl.length+' valgt'):'alle')+'</summary><div style="margin-top:8px;max-height:260px;overflow:auto">'+
    locKeys.map(function(k){return '<label class="chk" style="padding:3px 0"><input type="checkbox" data-rl="'+esc(k)+'"'+(r.locs&&r.locs[k]?' checked':'')+'> <span>'+esc(k)+' <span class="meta">'+locMap[k]+' fl.</span></span></label>'}).join('')+'</div>'+
    '<div class="actions" style="margin-top:8px"><button class="btn ghost small" data-act="rkLocAll">Alle steder</button></div>'+
    '<label class="chk" style="margin-top:8px"><input type="checkbox" id="rk_group"'+(r.group?' checked':'')+'> Rangér hvert lagringssted for seg</label></details>';
  var h='<h2>Rangering</h2>'+locHtml+'<div class="tools"><div><label for="rk_type">Type</label><select id="rk_type">'+opts(types,r.type,'Alle typer')+'</select></div>'+
   '<div><label for="rk_region">Region</label><select id="rk_region">'+opts(regions,r.region,'Alle regioner')+'</select></div>'+
   '<div><label for="rk_food">Passer til (fra vinene dine)</label><select id="rk_food">'+opts(foods,r.food,'Velg rett')+'</select></div>'+
   '<div><label for="rk_text">Eller skriv selv, f.eks. lam</label><input id="rk_text" value="'+esc(r.text)+'"></div>'+
   '<div class="full"><label for="rk_sort">Rangér etter</label><select id="rk_sort">'+SORTS.map(function(o){return '<option value="'+o[0]+'"'+(r.sort===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div>'+
   '<label class="chk"><input type="checkbox" id="rk_stock"'+(r.stock?' checked':'')+'> Bare på lager</label><label class="chk"><input type="checkbox" id="rk_wait"'+(r.wait?' checked':'')+'> Ta med viner som ikke er klare</label>'+
   '<label class="chk full"><input type="checkbox" id="rk_only"'+(r.only?' checked':'')+'> Bare viner som passer til maten</label></div>';
  if(r.sort==='samlet'){
    h+='<div class="panel" style="margin-top:0"><div class="meta" style="margin-bottom:6px">Vekting av den samlede rangeringen (0 = ignorer)</div><div class="grid2">'+
     [['wp','Poeng'],['ww','Drikkevindu'],['wf','Mat']].map(function(x){return '<div'+(x[0]==='wf'?' class="full"':'')+'><label for="rk_'+x[0]+'">'+x[1]+': '+r[x[0]]+(x[0]==='wf'&&!res.q?' (velg en rett for å bruke den)':'')+'</label><input type="range" id="rk_'+x[0]+'" min="0" max="5" step="1" value="'+r[x[0]]+'"></div>'}).join('')+'</div></div>';
  }
  if(untyped)h+='<div class="banner" style="margin-top:10px"><span>'+untyped+' viner mangler type.</span><button class="btn ghost small" data-act="guessTypes">Gjett type fra navn og druer</button></div>';
  if(!res.rows.length)return h+'<div class="empty">Ingen viner passer. Slå av et filter eller ta med viner som ikke er klare.</div>';
  var rowH=function(x,n){
    var i=x.i,p=[(n+1)+'.'];
    if(r.sort==='samlet')p.push('samlet '+i.comp);
    p.push(i.pv==null?'uten poeng':'poeng '+Math.round(i.pv));
    p.push(i.st.k==='now'?'drikk nå'+(x.w.to?' til '+x.w.to:''):(i.st.k==='over'?'over toppen':(i.st.k==='wait'?'lagres til '+x.w.from:'uten vindu')));
    if(res.q)p.push(i.F?'passer til '+res.q:'passer ikke oppgitt rett');
    return wineRow(x.w,'<div class="meta mono">'+esc(p.join(' · '))+'</div>');
  };
  if(r.group){
    var gm={},go=[];res.rows.forEach(function(x){var k=wineLoc(x.w);if(!gm[k]){gm[k]=[];go.push(k)}gm[k].push(x)});
    go.sort(locCmp);
    h+=go.map(function(k){var rows=gm[k],nb=rows.reduce(function(a,x){return a+(+x.w.qty||0)},0);return '<h3 style="margin:18px 0 6px;font-size:16px">'+esc(k)+' <span class="meta">'+rows.length+(rows.length===1?' vin':' viner')+' · '+nb+' fl.</span></h3><div class="list">'+rows.map(rowH).join('')+'</div>'}).join('');
  }else h+='<div class="list" style="margin-top:12px">'+res.rows.map(rowH).join('')+'</div>';
  return h;
}
function typeSel(id,cur,all){return '<div><label for="'+id+'">Type</label><select id="'+id+'"><option value="">'+all+'</option>'+TYPES.map(function(t){return '<option'+(cur===t?' selected':'')+'>'+t+'</option>'}).join('')+'</select></div>'}

var CMAP={'France':'Frankrike','Italy':'Italia','Spain':'Spania','Germany':'Tyskland','Austria':'Østerrike','Greece':'Hellas','Switzerland':'Sveits','Hungary':'Ungarn','South Africa':'Sør-Afrika','United Kingdom':'Storbritannia','Czech Republic':'Tsjekkia','Croatia':'Kroatia','Slovenia':'Slovenia','Romania':'Romania','Moldova':'Moldova','Lebanon':'Libanon','Israel':'Israel','Georgia':'Georgia','Brazil':'Brasil','Mexico':'Mexico','Uruguay':'Uruguay'};
var VTYPE=[[/sparkling/i,'Musserende'],[/ros[eé]/i,'Rosé'],[/dessert/i,'Dessert'],[/fortified/i,'Sterkvin'],[/red/i,'Rød'],[/white/i,'Hvit']];
function vivinoParse(lines){
  var L=lines.map(function(l){return l.trim()}).filter(Boolean),ri=-1,sc,cnt,m;
  for(var i=0;i<L.length;i++){
    if((m=L[i].match(/^(\d[.,]\d)\s+([\d\s.,]+)\s+ratings?$/i))){ri=i;sc=m[1];cnt=m[2];break}
    if(/^\d[.,]\d$/.test(L[i])&&L[i+1]&&(m=L[i+1].match(/^([\d\s.,]+)\s+ratings?$/i))){ri=i;sc=L[i];cnt=m[1];break}
  }
  if(ri<2)return null;
  var o={src:'Vivino'},head=L.slice(0,ri),vi=-1;
  head.forEach(function(l,k){if(vi<0&&/^(N\.?V\.?|\d{4})$/i.test(l))vi=k});
  if(vi<1)return null;
  var producer=head[vi-2]!==undefined?head[vi-2]:head[0],name=head[vi-1];
  o.name=name;
  if(vi===1){producer='';}
  var vint=/^\d{4}$/.test(head[vi])?head[vi]:'';
  var dot=head.filter(function(l){return /[·•]/.test(l)})[0];
  if(dot){var parts=dot.split(/[·•]/).map(function(x){return x.trim()}).filter(Boolean);
    VTYPE.some(function(t){return parts.some(function(p){if(/wine\s*$/i.test(p)&&t[0].test(p)){o.type=t[1];return true}return false})});
    if(parts[0]&&CMAP[parts[0]])o.country=CMAP[parts[0]];else if(parts[0])o.country=parts[0];
  }
  var fi=-1;for(var j=0;j<L.length;j++){if(/^Facts about the wine/i.test(L[j])){fi=j;break}}
  var f={};if(fi>=0){for(var k=fi+1;k<L.length-1;k++){if(/^(Winery|Grapes|Region|Wine style|Alcohol content|Allergens)$/i.test(L[k])){f[L[k].toLowerCase()]=L[k+1];k++}}}
  if(f.winery)o.producer=f.winery;else if(producer)o.producer=producer;
  if(f.grapes)o.grape=f.grapes;
  if(f.region){var rp=f.region.split('/').map(function(x){return x.trim()}).filter(Boolean);if(rp.length){o.country=CMAP[rp[0]]||rp[0];if(rp.length>1)o.region=rp.slice(1).join(', ')}}
  if(f['alcohol content'])o.abv=f['alcohol content'];
  if(vint)o.vintage=vint;
  var n=parseInt(String(cnt).replace(/[\s.,]/g,''),10),top=L.filter(function(l){return /^Among top/i.test(l)})[0],tm=top&&top.match(/top\s*(\d+)\s*%/i);
  o.note='Basert på '+n.toLocaleString('nb-NO')+' vurderinger på Vivino.'+(tm?' Blant de beste '+tm[1]+' % av alle viner i verden.':'');
  var title=[o.producer||producer,name,vint].filter(Boolean).join(' ');
  var c=matchWines(title);
  return {line:title,score:parseFloat(String(sc).replace(',','.')),max:5,cands:c,pick:c.length?c[0].id:'__new__',on:true,meta:o};
}

function vmpParse(text){
  var clean=String(text).replace(/\[([^\]]*)\]\([^)]*\)/g,'$1'),L=clean.split('\n').map(function(l){return l.trim()});
  if(!/Varetype/.test(clean)||!/Varenummer\s*\d{5,8}/.test(clean))return null;
  var o={src:'Vinmonopolet'},m,k;
  o.vmp=clean.match(/Varenummer\s*(\d{5,8})/)[1];
  if((m=clean.match(/Kr\s*(\d[\d\s.]*,\d{2})/)))o.price=pnum(m[1]);
  if((m=clean.match(/Kr\s*\d[\d\s.]*,\d{2}\s*(\d+(?:,\d+)?\s*cl)/i)))o.volume=m[1].replace(/\s+/g,' ');
  if((m=clean.match(/Alkohol\s*([\d,.]+\s*%)/)))o.abv=m[1].replace(/\s+/g,'');
  if((m=clean.match(/Sukker\s*([\d,.]+\s*g\/l)/)))o.sugar=m[1];
  if((m=clean.match(/Syre\s*([\d,.]+\s*g\/l)/)))o.acid=m[1];
  var kv={},keys=/^\*?\s*(Varetype|Lukt|Smak|Farge|Land, distrikt|Produsent|Årgang|Metode|Råstoff)\s*(.*)$/;
  L.forEach(function(l){var x=l.match(keys);if(x&&!kv[x[1]]&&x[2])kv[x[1]]=x[2].trim()});
  if(kv['Land, distrikt']){var cp=kv['Land, distrikt'].split(',').map(function(x){return x.trim()}).filter(Boolean);o.country=cp[0];if(cp.length>1)o.region=cp.slice(1).join(', ')}
  if(kv.Produsent)o.producer=kv.Produsent;
  if(kv['Råstoff'])o.grape=kv['Råstoff'];
  if(kv['Årgang']&&(m=kv['Årgang'].match(/^(19|20)\d{2}/)))o.vintage=m[0];
  var vt=kv.Varetype||'';
  [[/musserende/i,'Musserende'],[/ros[eé]/i,'Rosé'],[/rød/i,'Rød'],[/hvit/i,'Hvit'],[/dessert|søt/i,'Dessert'],[/sterk|port|sherry|madeira/i,'Sterkvin']].some(function(t){if(t[0].test(vt)){o.type=t[1];return true}return false});
  var pi=-1;for(var i=0;i<L.length;i++){if(/^Kr\s*\d/.test(L[i])){pi=i;break}}
  var name=pi>=2?L[pi-2]:'';
  if(!name||/ - /.test(name)){name='';for(var j=0;j<L.length;j++){if(/\s((19|20)\d{2}|NV)$/.test(L[j])&&!/^\*/.test(L[j])){name=L[j];break}}}
  o.name=name.replace(/\s+((19|20)\d{2}|NV)$/,'').trim();
  var fs=-1,fe=L.length;
  for(var a=0;a<L.length;a++){if(/^Passer til/i.test(L[a])){fs=a;break}}
  if(fs>=0){for(var b=fs+1;b<L.length;b++){if(/^(Karakteristikk|Stil,)/i.test(L[b])){fe=b;break}}
    var fd=L.slice(fs+1,fe).map(function(x){return x.replace(/^\*\s*/,'').trim()}).filter(Boolean);
    if(fd.length&&fd.length<=14)o.food=fd}
  if(/Drikkeklar nå/i.test(clean))o.from=String(YEAR);
  var nt=[];if(kv.Lukt)nt.push('Lukt: '+kv.Lukt);if(kv.Smak)nt.push('Smak: '+kv.Smak);if(kv.Farge)nt.push('Farge: '+kv.Farge);if(kv.Metode)nt.push('Metode: '+kv.Metode);
  if(nt.length)o.notes='Vinmonopolet. '+nt.join(' ');
  var title=[o.name,o.vintage].filter(Boolean).join(' ');
  var c=exactCands(o.vmp);if(!c.length)c=matchWines(title+' '+(o.producer||''));
  return {line:title||o.vmp,score:null,max:100,cands:c,pick:c.length?c[0].id:'__new__',on:true,meta:o};
}

/* ---------- drukket: logg over viner du har drukket ---------- */
function vLogg(){
  var q=normS(ui.lg.q),yr=ui.lg.y,all=db.log.slice();
  var years=uniq(all.map(function(e){return String(e.date||'').slice(0,4)})).reverse();
  var rows=all.filter(function(e){
    if(yr&&String(e.date||'').slice(0,4)!==yr)return false;
    if(q&&normS([e.name,e.vintage,e.producer,e.place,e.note].join(' ')).indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return (String(b.date)+b.id).localeCompare(String(a.date)+a.id)});
  var thisYear=all.filter(function(e){return String(e.date||'').slice(0,4)===String(YEAR)}).length;
  var h='<h2>Drukket</h2><p class="meta">Her lagres vinene du har drukket, med dato, poeng og notater. De vises ikke i kjelleren, men blir liggende her så du kan se tilbake. '+all.length+' totalt, '+thisYear+' i '+YEAR+'.</p>'+
   '<div class="tools"><div><label for="lg_q">Søk</label><input id="lg_q" type="search" value="'+esc(ui.lg.q)+'" placeholder="Navn, sted, notat"></div>'+
   '<div><label for="lg_y">År</label><select id="lg_y">'+opts(years,yr,'Alle år')+'</select></div>'+
   '<div class="full"><button class="btn" data-act="logNew">Legg til drukket vin</button></div></div>';
  if(!rows.length)return h+'<div class="empty">'+(all.length?'Ingen treff.':'Ingen er logget ennå. Åpne en vin og bruk «Registrer drukket», eller legg til en vin du har drukket et annet sted.')+'</div>';
  return h+'<div class="list">'+rows.map(function(e){
    var has=e.score!==''&&e.score!=null;
    return '<div class="logrow"><div style="display:flex;justify-content:space-between;gap:10px"><span class="name">'+esc(e.name)+' '+(e.vintage?esc(e.vintage):'')+'</span>'+(has?'<span class="score">'+esc(e.score)+' / 100</span>':'')+'</div>'+
     '<div class="meta">'+esc([fdate(e.date),e.place,e.producer].filter(Boolean).join(' · '))+'</div>'+(e.note?'<div class="note">'+esc(e.note)+'</div>':'')+
     '<div class="actions" style="margin-top:6px"><button class="btn ghost small" data-act="logEdit" data-lid="'+e.id+'">Rediger</button>'+(byId(e.wineId)?'<button class="btn ghost small" data-open="'+e.wineId+'">Åpne vin</button>':'')+'</div></div>';
  }).join('')+'</div>';
}
function logById(id){return db.log.filter(function(e){return e.id===id})[0]}
function vLogSheet(id){
  var e=id?logById(id):null,linked=e&&e.wineId&&byId(e.wineId);

   (linked?'<div class="full"><div class="name">'+esc(e.name)+' '+esc(e.vintage||'')+'</div></div>':field('l_name','Vinnavn',e.name,'text',{full:1,attr:'required'})+field('l_vint','Årgang',e.vintage,'text',{attr:'inputmode="numeric"'}))+
   field('l_date','Dato',e.date,'date')+field('l_score','Poeng (0–100)',e.score,'number',{attr:'inputmode="numeric" min="0" max="100"'})+
   field('l_place','Sted eller anledning',e.place||'','text',{full:1})+
   '<div class="full"><label for="l_note">Smaksnotat</label><textarea id="l_note">'+esc(e.note)+'</textarea></div></div>'+
   '<div class="actions"><button class="btn" type="submit">Lagre</button><button class="btn ghost" type="button" data-close="1" data-x="1">Avbryt</button>'+(id?'<button class="btn danger" type="button" data-act="delLog">Slett</button>':'')+'</div></form></div></div>';
}
function saveLog(){
  var id=ui.sheet&&ui.sheet.id,e=id?logById(id):null,isNew=!e;
  if(isNew){e={id:uid(),wineId:'',name:'',vintage:'',date:today(),score:'',place:'',note:''};db.log.push(e)}
  var linked=e.wineId&&byId(e.wineId);
  if(!linked){var nm=val('l_name');if(!nm){toast('Skriv inn et vinnavn');if(isNew)db.log.pop();return}e.name=nm;e.vintage=val('l_vint')}
  e.date=val('l_date')||today();e.score=val('l_score');e.place=val('l_place');e.note=val('l_note');e.updated=Date.now();
  save();ui.sheet=null;render();toast(isNew?'Lagt til i Drukket':'Endringer lagret');
}

function scanMsg(t){var m=document.getElementById('scanMsg');if(m)m.textContent=t}
function gotCode(c){var i=document.getElementById('f_ean');if(i)i.value=c;scanMsg('Strekkode lest: '+c+'. Finn varenummeret på vinmonopolet.no og lim det inn over om du vil.')}
function loadLib(){return new Promise(function(res,rej){if(window.Html5Qrcode)return res();var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function decodeBarcode(file){
  var fb=function(){return loadLib().then(function(){var d=document.getElementById('scanTmp');if(!d){d=document.createElement('div');d.id='scanTmp';d.hidden=true;document.body.appendChild(d)}return new window.Html5Qrcode('scanTmp').scanFile(file,false)})};
  if('BarcodeDetector' in window){
    return createImageBitmap(file).then(function(bmp){return new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}).detect(bmp)}).then(function(r){return (r&&r.length)?r[0].rawValue:fb()},fb);
  }
  return fb();
}
function scan(file){
  scanMsg('Leser strekkode\u2026');
  decodeBarcode(file).then(gotCode,function(){scanMsg('Fant ingen strekkode. Ta et nærmere bilde med god belysning, og hold koden vannrett.')});
}
function scanFind(file){
  toast('Leser strekkode\u2026');
  decodeBarcode(file).then(function(code){
    code=String(code).trim();
    var w=db.wines.filter(function(x){return !x.example&&String(x.ean)===code})[0];
    if(w){ui.tab='kjeller';ui.sheet={mode:'view',id:w.id};render();toast('Vinen finnes allerede i kjelleren')}
    else{ui.tab='poeng';ui.pr.ean=code;ui.sheet=null;render();toast('Ny strekkode: '+code)}
  },function(){toast('Fant ingen strekkode. Ta et nærmere, skarpt bilde.')});
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.sheet){ui.sheet=null;renderSheet()}});
